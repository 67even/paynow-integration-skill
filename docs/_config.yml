title: Paynow Integration Skill
description: >-
  Integrate Paynow Zimbabwe correctly in PHP/Laravel, Node.js/Express or raw
  HTTP. EcoCash, OneMoney, InnBucks. Verified against Paynow's own SDKs.

url: https://67even.github.io
baseurl: /paynow-integration-skill
repository: 67even/paynow-integration-skill

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: 67even
logo: "/assets/images/67even-logo.png"

author:
  name: John Mugabe

# --- Google Search Console --------------------------------------------------
# Deliberately NOT jekyll-seo-tag's `webmaster_verifications.google` key: that
# one emits the tag on every page, and the tag is only ever read on the
# property URL, which is the entry page. _includes/head_custom.html renders it
# there. To put it on every page instead, delete this and set
#   webmaster_verifications:
#     google: "<token>"
# which seo-tag handles natively.
google_site_verification_token: "1J0N9Y8BUH5i51OK_NqAPKYAay-BURoxm9UmJ1d28I8"

# jekyll-seo-tag is rendered by the theme's head; sitemap needs no include.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# --- search ----------------------------------------------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# --- links out to the repository -------------------------------------------
aux_links:
  "GitHub":
    - "https://github.com/67even/paynow-integration-skill"
aux_links_new_tab: true

nav_external_links:
  - title: Repository on GitHub
    url: https://github.com/67even/paynow-integration-skill
    hide_icon: false

# --- "edit this page" straight into the SOURCE file, not the generated copy -
gh_edit_link: false   # pages are generated; each one links to its own source instead
gh_edit_link_text: "Edit the source of this page on GitHub"
gh_edit_repository: "https://github.com/67even/paynow-integration-skill"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  MIT licensed. Written and maintained by
  <a href="https://github.com/johnmugabe">John Mugabe</a> under
  <a href="https://github.com/67even">67even</a>. Independent and
  community-maintained - not affiliated with or endorsed by Paynow Zimbabwe.

# --- callouts --------------------------------------------------------------
callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: grey-dk

# --- every page uses the theme's default layout -----------------------------
# just-the-docs ships no _config.yml of its own and Jekyll does not merge theme
# config, so without this every page would render as bare body content.
defaults:
  - scope:
      path: ""
    values:
      layout: default

heading_anchors: true
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
